name: Weekly Verification

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64  # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify against Cabinet Office CSV
        run: bundle exec rake verified_holidays:verify

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            // Reuse the open issue from a previous failure instead of opening a new one every week.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-update',
              per_page: 1
            });

            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body: `Verification failed again on ${new Date().toISOString().split('T')[0]}: [View workflow run](${runUrl})`
              });
              return;
            }

            const title = `Holiday data verification failed (${new Date().toISOString().split('T')[0]})`;
            const body = [
              '## Holiday Data Verification Failed',
              '',
              'The weekly verification against the [Cabinet Office CSV](https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv) has failed.',
              '',
              'Check the workflow log: a `MISSING` / `EXTRA` / `MISMATCH` list means the data changed and',
              '`rake verified_holidays:update` should be run and submitted as a PR. A `FetchError` means the',
              'CSV could not be retrieved and the run should be retried later.',
              '',
              `[View workflow run](${runUrl})`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['data-update']
            });
