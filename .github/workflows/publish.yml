name: Publish (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. verified_holidays/v0.3.6)'
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate tag name
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^verified_holidays/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag: '$TAG' (expected verified_holidays/vX.Y.Z)"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64  # v1
        with:
          bundler-cache: true
          ruby-version: ruby
      - uses: rubygems/release-gem@e9a6361a0b14562539327c2a02373edc56dd3169  # v1
        with:
          await-release: false
